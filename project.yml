name: WordSnip
options:
  bundleIdPrefix: com.aldrinnellas
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Manual
targets:
  WordSnip:
    type: application
    platform: macOS
    sources:
      - path: WordSnip
    info:
      path: WordSnip/Info.plist
      properties:
        CFBundleDisplayName: $(PRODUCT_NAME)
        CFBundleShortVersionString: "1.9.3"
        CFBundleVersion: "12"
        LSUIElement: true
        NSHighResolutionCapable: true
        NSScreenCaptureUsageDescription: Word Snip reads the selected area of your screen to copy text or QR codes.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aldrinnellas.wordsnip
        PRODUCT_NAME: Word Snip
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
