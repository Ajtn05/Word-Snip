name: WordSnip
options:
  bundleIdPrefix: com.aldrinnellas
  deploymentTarget:
    macOS: "14.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: CD4D712C8AA4110E3322ADAACA1DEAE098E4C902
    DEVELOPMENT_TEAM: R8P2P2R3S4
targets:
  WordSnip:
    type: application
    platform: macOS
    sources:
      - path: WordSnip
    info:
      path: WordSnip/Info.plist
      properties:
        CFBundleDisplayName: Word Snip
        CFBundleShortVersionString: "1.1"
        LSUIElement: true
        NSHighResolutionCapable: true
        NSScreenCaptureUsageDescription: Word Snip reads the selected area of your screen to copy its text.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aldrinnellas.wordsnip
        PRODUCT_NAME: Word Snip
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
